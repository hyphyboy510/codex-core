name = "codex-core"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Durable Objects for Tlalli-Keeton and per-user memory
[[durable_objects.bindings]]
name = "TLALLI_KEETON"
class_name = "TlalliKeeton"

[[durable_objects.bindings]]
name = "USER_MEMORY"
class_name = "UserMemory"

[[migrations]]
tag = "v1"
new_classes = ["TlalliKeeton", "UserMemory"]

# D1 for structured long-term memory (Delta Ledger)
# After you run: npx wrangler d1 create codex-delta-ledger
# paste the database_id below and uncomment.
[[d1_databases]]
binding = "DELTA_LEDGER"
database_name = "codex-delta-ledger"
database_id = "REPLACE_WITH_REAL_ID"   # ← run `npx wrangler d1 create codex-delta-ledger`

# Optional later:
# [[vectorize]]
# binding = "VECTOR_MEMORY"
# index_name = "codex-memory"

# [[r2_buckets]]
